<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal & Bloom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="border-frame">
            <img src="picture/letter.png" alt="Mail" class="letter-icon" id="letterIcon">
            
            <div class="center-content">
                <img src="picture/petal bloom transparent.png" alt="Petal Bloom Logo" class="main-logo">
                <button class="start-btn">start</button>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="welcomePopup">
        <div class="popup-content">
            <img src="picture/opening.png" alt="Welcome to Petal & Bloom" class="popup-image">
            <button class="close-btn" id="closePopupBtn"></button>
        </div>
    </div>

    <div class="side-menu-overlay" id="sideMenuOverlay"></div>
    
    <div class="side-menu" id="sideMenu">
        <button class="close-menu-btn" id="closeMenuBtn">X</button>
        <div class="menu-links">
            <a href="#">Dashboard</a>
            <a href="#">Flowers Library</a>
            <a href="#">Flower Meanings</a>
            <a href="#">Flowers Colors</a>
            <a href="#">Fun Facts</a>
            <a href="#">About Us</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
